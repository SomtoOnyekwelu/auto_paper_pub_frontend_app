name = "ajournals"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-29"

# R2 galley bucket: served at the local-looking /journals/:initials/:slug/galley.pdf
# URL by functions/journals/[journal_initials]/[slug]/galley.pdf.ts (the edge
# proxy — Google Scholar same-subdirectory rule). The backend uploads the galley
# to this bucket via the authenticated wrangler CLI (key: <initials>/<slug>.pdf).
[[r2_buckets]]
binding = "GALLEYS"
bucket_name = "for-paper-pub-system"

[env.production]
